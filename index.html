<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>
      Frontend Mentor | Huddle landing page with single introductory section
    </title>
  </head>
  <body>
    <main>
      <div class="image-container">
        <img
          class="image logo"
          src="./images/logo.svg"
          alt="Huddle logo"
          height="140px"
          width="170px"
        />
        <img
          height="506"
          width="709"
          class="image mockup"
          src="./images/illustration-mockups.svg"
          alt="Illustration of Huddle app mockups on desktop and mobile devices"
        />
      </div>

      <div class="text-container">
        <h1 class="text header">Build The Community Your Fans Will Love</h1>

        <p class="text paragraph">
          Huddle re-imagines the way we build communities. You have a voice, but
          so does your audience. Create connections with your users as you
          engage in genuine discussion.
        </p>

        <button class="button-reg">Register</button>

        <div class="social-icons">
          <a href="#" class="icon-links"
            ><img
              class="icons facebook"
              src="./images/logo-facebook.svg"
              alt=""
          /></a>
          <a href="#" class="icon-links"
            ><img class="icons twitter" src="./images/logo-twitter.svg" alt=""
          /></a>
          <a href="#" class="icon-links"
            ><img
              class="icons instagram"
              src="./images/logo-instagram.svg"
              alt=""
          /></a>
        </div>
      </div>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by
      <a href="https://www.frontendmentor.io/profile/ry-cr8">ry-cr8</a>.
    </footer>
  </body>
</html>
